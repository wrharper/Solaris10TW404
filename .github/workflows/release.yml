name: Build and Release IPConverter

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Restore dependencies
      run: dotnet restore IPConverter.sln
    
    - name: Build
      run: dotnet build IPConverter.sln --configuration Release --no-restore
    
    - name: Publish self-contained executable
      run: dotnet publish IPConverter/IPConverter.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishReadyToRun=true -o ./publish
    
    - name: Create ZIP archive
      run: Compress-Archive -Path ./publish/IPConverter.exe -DestinationPath ./IPConverter-win-x64.zip
    
    - name: Get version from tag
      id: get_version
      run: |
        if ($env:GITHUB_REF -match 'refs/tags/(.*)') {
          $version = $matches[1]
        } else {
          $version = "dev-build"
        }
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
      shell: pwsh
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          ./IPConverter-win-x64.zip
          ./publish/IPConverter.exe
        name: IPConverter ${{ steps.get_version.outputs.VERSION }}
        body: |
          ## IPConverter Release ${{ steps.get_version.outputs.VERSION }}
          
          ### Download and Run
          
          **Option 1: Standalone Executable (Recommended)**
          - Download `IPConverter.exe`
          - Double-click to run - no installation needed!
          
          **Option 2: ZIP Archive**
          - Download `IPConverter-win-x64.zip`
          - Extract and run `IPConverter.exe`
          
          ### What's Included
          - Self-contained Windows executable (no .NET runtime required)
          - Compatible with Windows 10/11 (x64)
          
          ### About
          A simple tool to convert IPv4 addresses to decimal format.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload artifact for manual download
      if: "!startsWith(github.ref, 'refs/tags/')"
      uses: actions/upload-artifact@v4
      with:
        name: IPConverter-win-x64
        path: |
          ./publish/IPConverter.exe
          ./IPConverter-win-x64.zip
        retention-days: 30
